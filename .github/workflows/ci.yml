name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    # Without this, a go.mod bump past the oldest matrix entry would silently
    # download a newer toolchain and the leg would pass without testing it.
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', '1.26.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Vet
        run: go vet -tags integration ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"

      - name: Lint
        run: "$(go env GOPATH)/bin/golangci-lint run --build-tags=integration ./..."

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(go list -f '{{.Dir}}' ./...))
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  integration:
    name: Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cache
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: cache
          MYSQL_DATABASE: gocache
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uroot -pcache --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run the driver conformance suite against real backends
        env:
          GOCACHE_TEST_POSTGRES: postgres://postgres:cache@localhost:5432/postgres?sslmode=disable
          GOCACHE_TEST_MYSQL: root:cache@tcp(127.0.0.1:3306)/gocache?parseTime=true
          GOCACHE_TEST_REDIS: 127.0.0.1:6379
        run: go test -race -count=1 -tags integration ./...

  cluster:
    name: Redis cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start a three-master Redis cluster
        run: |
          docker run -d --name gocache-redis-cluster \
            -p 7100:7100 -p 7101:7101 -p 7102:7102 \
            redis:7 sh -c '
              for port in 7100 7101 7102; do
                redis-server --port "$port" --cluster-enabled yes \
                  --cluster-config-file "nodes-$port.conf" --cluster-announce-ip 127.0.0.1 \
                  --dir /tmp --appendonly no --save "" --daemonize yes
              done
              until redis-cli -p 7100 ping && redis-cli -p 7101 ping && redis-cli -p 7102 ping; do sleep 1; done
              redis-cli --cluster create 127.0.0.1:7100 127.0.0.1:7101 127.0.0.1:7102 --cluster-yes
              tail -f /dev/null
            '
          for _ in $(seq 60); do
            converged=0
            for port in 7100 7101 7102; do
              info=$(docker exec gocache-redis-cluster redis-cli -p "$port" cluster info 2>/dev/null || true)
              case "$info" in
                *cluster_state:ok*cluster_slots_assigned:16384*) converged=$((converged + 1)) ;;
              esac
            done
            if [ "$converged" -eq 3 ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs gocache-redis-cluster
          for port in 7100 7101 7102; do
            docker exec gocache-redis-cluster redis-cli -p "$port" cluster info || true
          done
          exit 1

      - name: Run the driver conformance suite against a Redis cluster
        env:
          GOCACHE_TEST_REDIS_CLUSTER: 127.0.0.1:7100,127.0.0.1:7101,127.0.0.1:7102
        run: go test -race -count=1 -tags integration ./driver/redisdriver/

  docs:
    name: Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Build the documentation site
        run: npm run build
